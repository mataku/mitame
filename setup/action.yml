name: Setup mitame
description: Download a mitame release binary and add it to PATH
inputs:
  version:
    description: Release tag to install, such as v0.1.0, or latest
    required: false
    default: latest
  repository:
    description: GitHub repository that publishes the releases
    required: false
    default: mataku/mitame
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MITAME_VERSION: ${{ inputs.version }}
        MITAME_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *) echo "unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        if [ "${MITAME_VERSION}" = "latest" ]; then
          base="https://github.com/${MITAME_REPOSITORY}/releases/latest/download"
        else
          base="https://github.com/${MITAME_REPOSITORY}/releases/download/${MITAME_VERSION}"
        fi
        archive="mitame-${target}.tar.gz"
        dir="${RUNNER_TEMP}/mitame"
        mkdir -p "${dir}"
        cd "${dir}"
        curl -fsSL -o "${archive}" "${base}/${archive}"
        curl -fsSL -o "${archive}.sha256" "${base}/${archive}.sha256"
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c "${archive}.sha256"
        else
          shasum -a 256 -c "${archive}.sha256"
        fi
        tar -xzf "${archive}"
        echo "${dir}/mitame-${target}" >> "${GITHUB_PATH}"
        binary="${dir}/mitame-${target}/mitame"
        if [ "${RUNNER_OS}" = "Windows" ]; then
          binary="${binary}.exe"
        fi
        "${binary}" --version
