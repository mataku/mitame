[workspace]
resolver = "2"
members = ["crates/mitame-contract", "crates/mitame-core", "crates/mitame-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mataku/mitame"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "none"
