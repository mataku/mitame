name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: flutter pub get
        working-directory: adapters/flutter
      - run: flutter pub get
        working-directory: adapters/flutter/example
      - run: dart analyze
        working-directory: adapters/flutter
      - run: dart format --set-exit-if-changed -o none lib example/lib example/test
        working-directory: adapters/flutter
      - run: flutter test
        working-directory: adapters/flutter/example
        env:
          MITAME_PROFILE: linux
      - run: cargo build --locked -p mitame-cli
      - run: ../../../target/debug/mitame compare --profile linux
        working-directory: adapters/flutter/example
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mitame-report
          path: adapters/flutter/example/.mitame/report

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p mitame-cli
      - run: ../../target/debug/mitame run --profile linux -- ./gradlew :example:testDebugUnitTest --rerun --no-daemon
        working-directory: adapters/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mitame-report-android
          path: adapters/android/.mitame/report

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p mitame-cli
      - id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            [ .devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | { v: (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)), devices: .value } ]
            | sort_by(.v) | last | .devices
            | map(select(.name | test("^iPhone")))
            | (map(select(.name | test("^iPhone [0-9]+$"))) + .)[0].udid // empty')
          test -n "$udid"
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - run: ../../target/debug/mitame run --profile ci-macos -- xcodebuild test -scheme Mitame -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -quiet
        working-directory: adapters/ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mitame-report-ios
          path: adapters/ios/.mitame/report
