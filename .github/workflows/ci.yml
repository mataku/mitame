name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: flutter pub get
        working-directory: adapters/flutter
      - run: flutter pub get
        working-directory: adapters/flutter/example
      - run: dart analyze
        working-directory: adapters/flutter
      - run: dart format --set-exit-if-changed -o none lib example/lib example/test
        working-directory: adapters/flutter
      - run: flutter test
        working-directory: adapters/flutter/example
        env:
          MITAME_PROFILE: linux
      - run: cargo build --locked -p mitame-cli
      - run: ../../../target/debug/mitame compare --profile linux
        working-directory: adapters/flutter/example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mitame-report
          path: adapters/flutter/example/.mitame/report

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p mitame-cli
      - run: ../../target/debug/mitame run --profile linux -- ./gradlew :example:testDebugUnitTest --rerun --no-daemon
        working-directory: adapters/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mitame-report-android
          path: adapters/android/.mitame/report

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p mitame-cli
      - run: ../../target/debug/mitame run --profile ci-macos -- xcodebuild test -scheme Mitame -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' -quiet
        working-directory: adapters/ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mitame-report-ios
          path: adapters/ios/.mitame/report
