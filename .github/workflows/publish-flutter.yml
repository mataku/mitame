name: publish-flutter

on:
  push:
    tags: ["flutter-v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          tag="${GITHUB_REF_NAME#flutter-v}"
          pub_version="$(sed -n 's/^version: \(.*\)/\1/p' adapters/flutter/pubspec.yaml)"
          echo "tag=$tag pubspec=$pub_version"
          test "$tag" = "$pub_version"

  publish:
    needs: check-version
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      working-directory: adapters/flutter
