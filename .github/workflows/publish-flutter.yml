name: publish-flutter

on:
  push:
    tags: ["flutter-v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          tag="${GITHUB_REF_NAME#flutter-v}"
          pub_version="$(sed -n 's/^version: \(.*\)/\1/p' adapters/flutter/pubspec.yaml)"
          echo "tag=$tag pubspec=$pub_version"
          test "$tag" = "$pub_version"

  publish:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: .github/scripts/bundle-flutter-binaries.sh adapters/flutter
        env:
          GH_TOKEN: ${{ github.token }}
      - run: flutter pub get
        working-directory: adapters/flutter
      - run: dart pub publish --dry-run
        working-directory: adapters/flutter
      - run: dart pub publish --force
        working-directory: adapters/flutter
