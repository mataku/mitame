name: publish-android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - id: version
        run: |
          version="$(sed -n 's/^VERSION_NAME=\(.*\)/\1/p' gradle.properties)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' ../../Cargo.toml | head -1)"
          echo "android=$version cargo=$cargo_version"
          test -n "$version"
          case "$version" in *SNAPSHOT*) echo "refusing to publish a SNAPSHOT" >&2; exit 1 ;; esac
          test "$version" = "$cargo_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: ./gradlew publishToMavenLocal -PsignAllPublications=false --no-daemon
      - run: ls -R ~/.m2/repository/io/github/mataku
      - env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
        run: ./gradlew publishToMavenCentral --no-daemon
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
